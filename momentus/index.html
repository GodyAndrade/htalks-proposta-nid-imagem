<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Material indisponivel</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0e1b2f;
      --text: #eef7ff;
      --muted: #9fb6d3;
      --line: rgba(255, 255, 255, .14);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #050b14, var(--bg));
      color: var(--text);
    }
    main {
      width: min(620px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">HEADS Tecnologia</div>
    <h1>Material temporariamente indisponivel</h1>
    <p>Esta apresentacao foi retirada do ar por enquanto.</p>
  </main>
</body>
</html>
