  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\n  :root{\n    --bg:#0a0f1e;\n    --bg-elev:#0f172a;\n    --bg-soft:#0c1326;\n    --border:#1e293b;\n    --border-soft:#172033;\n    --primary:#2563eb;\n    --primary-hov:#1d4fd9;\n    --cyan:#06b6d4;\n    --cyan-2:#22d3ee;\n    --text:#ffffff;\n    --text-2:#cbd5e1;\n    --text-3:#94a3b8;\n    --text-4:#64748b;\n    --green:#10b981;\n    --gold:#f59e0b;\n    --maxw:1160px;\n  }\n  *{box-sizing:border-box}\n  html{scroll-behavior:smooth}\n  html,body{margin:0;padding:0}\n  body{\n    background:var(--bg);\n    color:var(--text);\n    font-family:\"Plus Jakarta Sans\",system-ui,sans-serif;\n    -webkit-font-smoothing:antialiased;\n    overflow-x:hidden;\n    line-height:1.5;\n  }\n  a{color:var(--cyan-2);text-decoration:none}\n  a:hover{color:#67e8f5}\n  img{max-width:100%;display:block}\n  .container{max-width:var(--maxw);margin:0 auto;padding:0 28px}\n  .mono{font-family:\"JetBrains Mono\",monospace}\n\n  /* ---------- NAV ---------- */\n  .nav{\n    position:sticky;top:0;z-index:50;\n    background:rgba(10,15,30,.82);\n    backdrop-filter:saturate(140%) blur(12px);\n    -webkit-backdrop-filter:saturate(140%) blur(12px);\n    border-bottom:1px solid var(--border-soft);\n  }\n  .nav-inner{\n    max-width:var(--maxw);margin:0 auto;padding:14px 28px;\n    display:flex;align-items:center;gap:22px;\n  }\n  .brand-lockup{display:flex;align-items:center;gap:16px}\n  .brand-lockup .htalks{height:34px;width:auto;filter:brightness(0) invert(1)}\n  .brand-lockup .x{font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.14em;text-transform:uppercase}\n  .brand-lockup .client-chip{\n    display:flex;align-items:center;background:#fff;border-radius:10px;\n    padding:10px 20px;box-shadow:0 8px 20px -10px rgba(0,0,0,.6);\n  }\n  .brand-lockup .client-chip img{height:56px;width:auto}\n  .nav-links{display:flex;gap:26px;margin-left:auto}\n  .nav-links a{font-size:14px;color:var(--text-3);font-weight:500;transition:.15s}\n  .nav-links a:hover{color:var(--text)}\n  @media (max-width:920px){ .nav-links{display:none} }\n\n  /* ---------- shared section ---------- */\n  .section{padding:96px 0;position:relative}\n  .section-alt{background:var(--bg-soft)}\n  .divide{border-top:1px solid var(--border-soft)}\n  .sec-kicker{\n    display:inline-block;font-family:\"JetBrains Mono\",monospace;\n    font-size:12px;letter-spacing:.18em;text-transform:uppercase;\n    color:var(--cyan-2);margin-bottom:16px;font-weight:500;\n  }\n  .sec-title{\n    font-size:clamp(30px,4vw,50px);font-weight:800;letter-spacing:-.03em;\n    line-height:1.03;margin:0 0 16px;text-wrap:balance;max-width:16ch;\n  }\n  .sec-title.wide{max-width:22ch}\n  .sec-sub{font-size:17px;color:var(--text-3);max-width:560px;line-height:1.55;text-wrap:pretty;margin:0}\n  .sec-head{margin:0 0 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:end}\n  .sec-head .sec-sub{justify-self:end}\n  @media (max-width:820px){ .sec-head{grid-template-columns:1fr;gap:18px} .sec-head .sec-sub{justify-self:start} }\n\n  /* ---------- HERO ---------- */\n  .hero{position:relative;padding:80px 0 90px;overflow:hidden}\n  .hero::before{\n    content:\"\";position:absolute;left:62%;top:-40px;width:1000px;height:640px;\n    transform:translateX(-50%);\n    background:radial-gradient(50% 50% at 50% 50%, rgba(37,99,235,.28), transparent 70%);\n    filter:blur(60px);z-index:0;pointer-events:none;\n  }\n  .hero::after{\n    content:\"\";position:absolute;left:78%;top:200px;width:720px;height:460px;transform:translateX(-50%);\n    background:radial-gradient(50% 50% at 50% 50%, rgba(6,182,212,.16), transparent 70%);\n    filter:blur(55px);z-index:0;pointer-events:none;\n  }\n  .hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}\n  @media (max-width:940px){ .hero-grid{grid-template-columns:1fr;gap:40px} }\n  .eyebrow{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:6px 14px 6px 8px;background:rgba(15,23,42,.6);\n    border:1px solid var(--border);border-radius:99px;\n    font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:26px;\n  }\n  .eyebrow .tag{\n    background:rgba(6,182,212,.12);color:var(--cyan-2);border:1px solid rgba(6,182,212,.3);\n    padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.04em;\n  }\n  h1.headline{\n    font-size:clamp(38px,5.4vw,64px);line-height:1.0;letter-spacing:-.035em;\n    font-weight:800;margin:0 0 24px;text-wrap:balance;\n  }\n  h1.headline .accent{color:var(--cyan-2)}\n  .hero p.lead{font-size:clamp(16px,1.4vw,19px);color:var(--text-3);max-width:560px;line-height:1.6;margin:0 0 28px}\n  .pills{display:flex;flex-wrap:wrap;gap:10px}\n  .chip{\n    display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;\n    border:1px solid var(--border);background:var(--bg-elev);\n    font-size:13px;font-weight:600;color:var(--text-2);\n  }\n  .chip::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--cyan-2);box-shadow:0 0 0 3px rgba(34,211,238,.16)}\n\n  /* ---------- product frame (inbox mock) ---------- */\n  .product-frame{\n    position:relative;border-radius:14px;overflow:hidden;background:#0a1430;\n    border:1px solid var(--border);\n    box-shadow:0 60px 120px -30px rgba(0,0,0,.7),0 30px 60px -20px rgba(37,99,235,.28),inset 0 0 0 1px rgba(255,255,255,.04);\n  }\n  .pf-bar{display:flex;align-items:center;padding:12px 16px;background:#0a1226;border-bottom:1px solid var(--border);gap:8px}\n  .pf-dots{display:flex;gap:6px}\n  .pf-dots i{width:11px;height:11px;border-radius:50%;display:inline-block}\n  .pf-dots i:nth-child(1){background:#ff5f57}.pf-dots i:nth-child(2){background:#febc2e}.pf-dots i:nth-child(3){background:#28c840}\n  .pf-url{margin:0 auto;font-family:\"JetBrains Mono\",monospace;font-size:11.5px;color:var(--text-3);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:4px 14px;border-radius:99px}\n  .pf-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4)}\n  .pf-head .live{display:inline-flex;align-items:center;gap:7px;color:var(--cyan-2);font-size:11px}\n  .pf-head .live::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--cyan-2);animation:pulse 2s ease-in-out infinite}\n  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.4)}50%{box-shadow:0 0 0 5px rgba(34,211,238,0)}}\n  .pf-queue{display:flex;flex-direction:column}\n  .pf-conv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border-soft)}\n  .pf-conv:last-child{border-bottom:0}\n  .pf-conv b{display:block;font-size:14px;font-weight:600;color:var(--text)}\n  .pf-conv span.desc{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px}\n  .qtag{display:inline-flex;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}\n  .qtag.vendas{background:rgba(37,99,235,.18);color:#93c5fd}\n  .qtag.suporte{background:rgba(168,85,247,.18);color:#d8b4fe}\n  .qtag.gold{background:rgba(245,158,11,.16);color:#fcd34d}\n  .qtag.green{background:rgba(16,185,129,.16);color:#86efac}\n\n  /* ---------- cards / grids ---------- */\n  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}\n  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}\n  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n  @media (max-width:900px){ .grid3,.grid4{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr} }\n  @media (max-width:560px){ .grid3,.grid4{grid-template-columns:1fr} }\n\n  .card{\n    background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;\n    padding:28px;transition:.2s;\n  }\n  .card:hover{border-color:#2a3650;transform:translateY(-2px)}\n  .card .ic{\n    width:44px;height:44px;border-radius:11px;display:grid;place-items:center;margin-bottom:18px;\n    background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.2);color:var(--cyan-2);\n  }\n  .card .ic svg{width:22px;height:22px}\n  .card small{display:inline-block;font-family:\"JetBrains Mono\",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4);margin-bottom:10px}\n  .card h3{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}\n  .card p{font-size:14.5px;color:var(--text-3);margin:0;line-height:1.55}\n\n  /* metrics */\n  .metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--bg-elev)}\n  .metrics .m{padding:26px 24px;border-left:1px solid var(--border)}\n  .metrics .m:first-child{border-left:0}\n  .metrics .m .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1;background:linear-gradient(135deg,#fff 20%,var(--cyan-2));-webkit-background-clip:text;background-clip:text;color:transparent}\n  .metrics .m .l{display:block;margin-top:8px;font-size:13px;color:var(--text-3)}\n  @media (max-width:760px){ .metrics{grid-template-columns:1fr 1fr} .metrics .m:nth-child(3){border-left:0} }\n\n  /* chat sim + note */\n  .chatbox{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:0}\n  .chatbox .ch{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}\n  .chatbox .ch .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#6ee7b7;padding:5px 11px;border-radius:99px;background:rgba(16,185,129,.14)}\n  .chatbox .ch .st::before{content:\"\";width:6px;height:6px;border-radius:50%;background:#34d399}\n  .msgs{display:flex;flex-direction:column;gap:12px}\n  .bubble{max-width:82%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.45}\n  .bubble.in{align-self:flex-start;background:#11214a;border:1px solid var(--border);border-top-left-radius:4px;color:var(--text-2)}\n  .bubble.out{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--primary),var(--cyan));border-top-right-radius:4px;box-shadow:0 8px 20px -10px rgba(37,99,235,.6)}\n  .note{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:26px;border-left:4px solid var(--green)}\n  .note.gold{border-left-color:var(--gold)}\n  .note h3{font-size:18px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:10px}\n  .note h3 .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(16,185,129,.14);color:#6ee7b7}\n  .note.gold h3 .ic{background:rgba(245,158,11,.14);color:#fcd34d}\n  .note h3 .ic svg{width:15px;height:15px}\n  .note p{font-size:14.5px;color:var(--text-3);margin:0;line-height:1.6}\n\n  /* steps */\n  .step{background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative}\n  .step .n{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.28);font-family:\"JetBrains Mono\",monospace;font-weight:600;color:var(--cyan-2);margin-bottom:16px}\n  .step h3{font-size:16.5px;font-weight:700;margin:0 0 8px}\n  .step p{font-size:13.5px;color:var(--text-3);margin:0;line-height:1.5}\n\n  /* pricing */\n  .pricing{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:stretch}\n  @media (max-width:960px){ .pricing{grid-template-columns:1fr 1fr} }\n  @media (max-width:560px){ .pricing{grid-template-columns:1fr} }\n  .plan{position:relative;background:var(--bg-elev);border:1px solid var(--border);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column}\n  .plan.featured{border-color:var(--primary);background:linear-gradient(180deg,rgba(37,99,235,.10),transparent 55%),var(--bg-elev);box-shadow:0 0 0 1px rgba(37,99,235,.4),0 20px 60px -22px rgba(37,99,235,.4)}\n  .plan-tag{align-self:flex-start;font-family:\"JetBrains Mono\",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.05);color:var(--text-3);border:1px solid var(--border)}\n  .plan.featured .plan-tag{background:var(--primary);color:#fff;border-color:transparent}\n  .plan h3{font-size:15px;font-weight:600;color:var(--text-2);margin:18px 0 4px}\n  .plan .price{display:flex;align-items:baseline;gap:5px;margin:6px 0 2px}\n  .plan .price .v{font-size:32px;font-weight:800;letter-spacing:-.02em}\n  .plan .price small{font-size:14px;color:var(--text-4);font-weight:500}\n  .plan .setup{font-size:13px;color:var(--text-4);margin:0 0 20px}\n  .plan ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;flex:1}\n  .plan li{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--text-2);line-height:1.4}\n  .chk{width:19px;height:19px;border-radius:50%;flex-shrink:0;margin-top:1px;background:rgba(16,185,129,.15);color:var(--green);display:grid;place-items:center}\n  .chk svg{width:11px;height:11px;stroke-width:3}\n\n  /* table */\n  .table-box{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--bg-elev)}\n  .table-box .cap{padding:16px 20px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4);display:flex;align-items:center;gap:10px}\n  .table-box .cap .dot{width:8px;height:8px;border-radius:2px;background:var(--cyan-2)}\n  table{width:100%;border-collapse:collapse}\n  th,td{padding:14px 20px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--border-soft);font-size:14px}\n  th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4);font-weight:700}\n  tr:last-child td{border-bottom:0}\n  td{color:var(--text-2)}\n  td b{color:var(--text)}\n  td .hl{color:var(--cyan-2);font-weight:700}\n  .disc{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:#6ee7b7;padding:5px 11px;border-radius:99px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25)}\n\n  /* discount emphasis */\n  .disc-hero{\n    position:relative;display:flex;align-items:center;gap:20px;\n    padding:22px 26px;border-radius:18px;\n    background:radial-gradient(120% 160% at 100% 0%,rgba(16,185,129,.22),transparent 60%),linear-gradient(120deg,rgba(16,185,129,.12),rgba(6,182,212,.06)),var(--bg-elev);\n    border:1px solid rgba(16,185,129,.4);\n    box-shadow:0 24px 60px -28px rgba(16,185,129,.5);\n    overflow:hidden;\n  }\n  .disc-hero::after{content:\"\";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(80% 120% at 100% 0%,#000,transparent 70%);-webkit-mask-image:radial-gradient(80% 120% at 100% 0%,#000,transparent 70%);pointer-events:none}\n  .disc-hero .big{position:relative;font-size:clamp(48px,6vw,68px);font-weight:800;letter-spacing:-.04em;line-height:.9;background:linear-gradient(135deg,#fff 15%,#6ee7b7 70%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}\n  .disc-hero .big sup{font-size:.42em;font-weight:700;vertical-align:top;margin-left:2px;-webkit-text-fill-color:#6ee7b7}\n  .disc-hero .txt{position:relative}\n  .disc-hero .txt b{display:block;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}\n  .disc-hero .txt span{display:block;font-size:13px;color:var(--text-3);margin-top:3px}\n  @media (max-width:820px){ .disc-hero{width:100%} }\n\n  /* final CTA */\n  .final-cta{position:relative;border-radius:24px;overflow:hidden;padding:64px 48px;text-align:center;\n    background:radial-gradient(60% 100% at 50% 0%,rgba(37,99,235,.25),transparent 60%),radial-gradient(40% 80% at 50% 100%,rgba(6,182,212,.15),transparent 60%),var(--bg-elev);\n    border:1px solid var(--border)}\n  .final-cta::before{content:\"\";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(70% 80% at 50% 40%,#000,transparent 75%);-webkit-mask-image:radial-gradient(70% 80% at 50% 40%,#000,transparent 75%);pointer-events:none}\n  .final-cta > *{position:relative}\n  .final-cta h2{font-size:clamp(28px,4vw,46px);font-weight:800;letter-spacing:-.03em;margin:0 auto 16px;line-height:1.05;text-wrap:balance;max-width:20ch}\n  .final-cta p{color:var(--text-3);font-size:17px;max-width:560px;margin:0 auto 32px;line-height:1.55}\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 24px;border-radius:11px;font-weight:600;font-size:15px;transition:.16s;border:1px solid transparent}\n  .btn-primary{background:var(--primary);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}\n  .btn-primary:hover{background:var(--primary-hov);transform:translateY(-1px);color:#fff}\n  .btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}\n  .btn-ghost:hover{background:rgba(255,255,255,.04);border-color:#2a3650;color:var(--text)}\n  .cta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}\n  .btn svg{width:15px;height:15px}\n\n  /* footer */\n  footer{padding:56px 0 40px;border-top:1px solid var(--border)}\n  .foot-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}\n  .foot-brand{display:flex;align-items:center;gap:16px}\n  .foot-brand .htalks{height:28px;filter:brightness(0) invert(1);opacity:.9}\n  .foot-brand .client-chip{display:flex;align-items:center;background:#fff;border-radius:9px;padding:9px 17px}\n  .foot-brand .client-chip img{height:40px}\n  .foot-meta{color:var(--text-4);font-size:13px;text-align:right}\n\n  @media print{\n    .nav{position:static}\n    body{background:#fff;color:#0a0f1e}\n    .section,.hero{page-break-inside:avoid}\n  }\n</style>\n</head>\n<body>\n\n\n<!-- ============ NAV ============ -->\n<header class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"brand-lockup\">\n      <img class=\"htalks\" src=\"dd545afb-daa4-4b15-9e59-b696f1454e56\" alt=\"H-TALKS\">\n      <span class=\"x\">para</span>\n      <span class=\"client-chip\"><img src=\"86213a4f-6e0b-49b9-8e98-80ce47093ff3\" alt=\"Doces Vovó São Lourenço\"></span>\n    </div>\n    <nav class=\"nav-links\">\n      <a href=\"#diagnostico\">Diagnóstico</a>\n      <a href=\"#solucao\">Solução</a>\n      <a href=\"#implantacao\">Implantação</a>\n      <a href=\"#valores\">Valores</a>\n      <a href=\"#proximo\">Próximo passo</a>\n    </nav>\n  </div>\n</header>\n\n<main>\n<!-- ============ HERO ============ -->\n<section class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"container hero-grid\">\n    <div>\n      <span class=\"eyebrow\"><span class=\"tag\">PROPOSTA</span> Atendimento inteligente com IA</span>\n      <h1 class=\"headline\">WhatsApp oficial, e-commerce e revenda em uma <span class=\"accent\">operação que não para de vender</span>.</h1>\n      <p class=\"lead\">A Doces Vovó já tem tradição, loja online, revenda, campanhas e produtos com alta recorrência. O H-TALKS entra para organizar os canais, reduzir dependência de WhatsApp solto, qualificar leads com IA e conectar CRM, ERP novo e WooCommerce em uma operação com fila, histórico e responsável claro.</p>\n      <div class=\"pills\">\n        <span class=\"chip\">6 usuários iniciais</span>\n        <span class=\"chip\">SDR IA com 5 perguntas</span>\n        <span class=\"chip\">CRM + ERP + WooCommerce</span>\n        <span class=\"chip\">WhatsApp oficial</span>\n      </div>\n    </div>\n    <aside class=\"product-frame\">\n      <div class=\"pf-bar\">\n        <span class=\"pf-dots\"><i></i><i></i><i></i></span>\n        <span class=\"pf-url\">inbox.h-talks.com.br</span>\n        <span style=\"width:46px\"></span>\n      </div>\n      <div class=\"pf-head\">Inbox H-TALKS <span class=\"live\">ao vivo</span></div>\n      <div class=\"pf-queue\">\n        <div class=\"pf-conv\"><div><b>Lead de revenda</b><span class=\"desc\">Quer tabela, pedido mínimo e orientação</span></div><span class=\"qtag green\">atacado</span></div>\n        <div class=\"pf-conv\"><div><b>Carrinho no WooCommerce</b><span class=\"desc\">Cliente viu kits zero e não finalizou</span></div><span class=\"qtag gold\">e-commerce</span></div>\n        <div class=\"pf-conv\"><div><b>Pedido e rastreio</b><span class=\"desc\">Dúvida sobre envio, frete ou pagamento</span></div><span class=\"qtag suporte\">sac</span></div>\n        <div class=\"pf-conv\"><div><b>SDR IA qualifica</b><span class=\"desc\">Cinco perguntas antes do atendimento humano</span></div><span class=\"qtag vendas\">ia</span></div>\n      </div>\n    </aside>\n  </div>\n</section>\n\n<!-- ============ DIAGNÓSTICO ============ -->\n<section class=\"section section-alt\" id=\"diagnostico\" data-screen-label=\"Diagnóstico\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <div class=\"sec-kicker\">Diagnóstico</div>\n        <h2 class=\"sec-title wide\">A operação cresceu mais rápido que o WhatsApp consegue suportar sozinho.</h2>\n      </div>\n      <p class=\"sec-sub\">Pelo alinhamento com Igor, a prioridade é parar a sangria dos bloqueios, organizar o atendimento e preparar uma base conectada ao CRM, ERP e WooCommerce.</p>\n    </div>\n    <div class=\"grid3\">\n      <article class=\"card\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"></path></svg></div>\n        <small>Risco comercial</small><h3>Bloqueios afetam venda</h3>\n        <p>Igor relatou bloqueios recorrentes no WhatsApp mesmo sem operação de spam, com volume estimado de cerca de 1.500 leads/mensagens por mês.</p>\n      </article>\n      <article class=\"card\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"></path><path d=\"M7 14l4-4 4 4 6-6\"></path></svg></div>\n        <small>Vendas</small><h3>Revenda e e-commerce precisam de triagem</h3>\n        <p>O site trabalha com loja online, kits, linha zero, frete grátis, Pix e área de revenda. Cada entrada precisa cair no fluxo certo antes de virar ruído para a equipe.</p>\n      </article>\n      <article class=\"card\">\n        <div class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path><circle cx=\"8.5\" cy=\"7\" r=\"4\"></circle><path d=\"M20 8v6M23 11h-6\"></path></svg></div>\n        <small>Operação</small><h3>6 usuários precisam atuar com dono claro</h3>\n        <p>Comercial atacado, e-commerce e administrativo/financeiro precisam de filas, permissões, histórico por contato e assinatura de atendimento.</p>\n      </article>\n    </div>\n  </div>\n</section>\n\n<!-- ============ SOLUÇÃO ============ -->\n<section class=\"section\" id=\"solucao\" data-screen-label=\"Solução\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <div class=\"sec-kicker\">Solução</div>\n        <h2 class=\"sec-title wide\">Primeiro organizar e proteger o atendimento. Depois automatizar o crescimento.</h2>\n      </div>\n      <p class=\"sec-sub\">A entrada recomendada combina centralização do WhatsApp oficial, SDR IA para qualificação e integrações iniciais com CRM, ERP novo e WooCommerce.</p>\n    </div>\n    <div class=\"metrics\" style=\"margin-bottom:22px\">\n      <div class=\"m\"><span class=\"n\">6</span><span class=\"l\">usuários iniciais</span></div>\n      <div class=\"m\"><span class=\"n\">5</span><span class=\"l\">perguntas SDR IA</span></div>\n      <div class=\"m\"><span class=\"n\">3</span><span class=\"l\">integrações previstas</span></div>\n      <div class=\"m\"><span class=\"n\">10d</span><span class=\"l\">prazo base de implantação</span></div>\n    </div>\n    <div class=\"grid2\">\n      <div class=\"chatbox\">\n        <div class=\"ch\">Simulação de atendimento <span class=\"st\">online</span></div>\n        <div class=\"msgs\">\n          <div class=\"bubble in\">Oi, quero revender os doces da Vovó. Qual o pedido mínimo?</div>\n          <div class=\"bubble out\">Perfeito. Vou te fazer 5 perguntas rápidas para entender sua cidade, canal de venda, volume inicial, linha de interesse e prazo de compra.</div>\n          <div class=\"bubble in\">Também tenho dúvida sobre frete e tabela.</div>\n          <div class=\"bubble out\">Combinado. Ao final eu direciono para o time de atacado com um resumo e mantenho seu histórico para ninguém recomeçar o atendimento do zero.</div>\n        </div>\n      </div>\n      <div class=\"note\">\n        <h3><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>O que muda na prática</h3>\n        <p>O lead deixa de cair solto no WhatsApp. Ele entra em uma fila, recebe triagem inicial, ganha etiqueta, fica vinculado ao histórico e pode consultar dados do CRM, ERP ou WooCommerce conforme viabilidade técnica da API.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- ============ IMPLANTAÇÃO ============ -->\n<section class=\"section section-alt\" id=\"implantacao\" data-screen-label=\"Implantação\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <div class=\"sec-kicker\">Implantação</div>\n        <h2 class=\"sec-title wide\">Implantação em fases para não travar a operação atual.</h2>\n      </div>\n      <p class=\"sec-sub\">A proposta separa o que entra no go-live do que depende de documentação, acesso técnico e validação das APIs.</p>\n    </div>\n    <div class=\"grid4\" style=\"margin-bottom:20px\">\n      <div class=\"step\"><div class=\"n\">1</div><h3>Base H-TALKS</h3><p>Configuração dos 6 usuários, WhatsApp oficial, filas, etiquetas, permissões e assinatura de atendimento.</p></div>\n      <div class=\"step\"><div class=\"n\">2</div><h3>SDR IA</h3><p>Criação do agente com 5 perguntas de qualificação, tom alinhado à Doces Vovó e guardrails contra resposta fora de escopo.</p></div>\n      <div class=\"step\"><div class=\"n\">3</div><h3>Integrações</h3><p>Validação técnica e conexão com CRM via API, ERP novo via API/banco e WooCommerce.</p></div>\n      <div class=\"step\"><div class=\"n\">4</div><h3>Ajuste assistido</h3><p>Janela de acompanhamento pós-go-live para corrigir respostas, filas e automações com base no uso real.</p></div>\n    </div>\n    <div class=\"note gold\">\n      <h3><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"></path></svg></span>Regra de escopo</h3>\n      <p>CRM, ERP e WooCommerce entram como integrações previstas no projeto, condicionadas à análise de documentação, autenticação, limites, webhooks/eventos e qualidade dos dados. Integrações fora do padrão ou automações adicionais podem ser orçadas separadamente.</p>\n    </div>\n  </div>\n</section>\n\n<!-- ============ VALORES ============ -->\n<section class=\"section\" id=\"valores\" data-screen-label=\"Valores\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <div class=\"sec-kicker\">Planos e valores</div>\n        <h2 class=\"sec-title wide\">Tabela oficial H-TALKS, com o Plano Pro recomendado para a Doces Vovó.</h2>\n      </div>\n      <p class=\"sec-sub\">O cenário informado é de 6 usuários: 5 agentes + 1 supervisor. Por isso, o melhor encaixe comercial é o Plano Pro, mantendo espaço para integrações e automações sem vender um Enterprise antes da hora.</p>\n    </div>\n\n    <div class=\"pricing\">\n      <article class=\"plan\">\n        <span class=\"plan-tag\">Essencial</span>\n        <h3>2 agentes + 1 supervisor</h3>\n        <div class=\"price\"><span class=\"v\">R$ 349</span><small>/mês</small></div>\n        <p class=\"setup\">Setup: R$ 1.999</p>\n        <ul>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>WhatsApp oficial integrado</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Inbox unificado de atendimento</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>IA básica personalizada para FAQ</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Mini CRM com histórico do cliente</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Etiquetas e organização de conversas</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Relatório básico de volume e tempo de resposta</li>\n        </ul>\n      </article>\n      <article class=\"plan\">\n        <span class=\"plan-tag\">Start</span>\n        <h3>3 agentes + 1 supervisor</h3>\n        <div class=\"price\"><span class=\"v\">R$ 499</span><small>/mês</small></div>\n        <p class=\"setup\">Setup: R$ 2.499</p>\n        <ul>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>WhatsApp + Instagram integrados</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>IA personalizada para qualificação inicial</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Handoff IA para humano</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Mini CRM</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Relatórios de atendimento e conversão</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>1 integração adicional</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Implantação guiada e acompanhamento inicial</li>\n        </ul>\n      </article>\n      <article class=\"plan featured\">\n        <span class=\"plan-tag\">Plano recomendado</span>\n        <h3>Pro · 5 agentes + 1 supervisor</h3>\n        <div class=\"price\"><span class=\"v\">R$ 849</span><small>/mês</small></div>\n        <p class=\"setup\">Setup: R$ 3.999</p>\n        <ul>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>IA avançada para qualificação, objeção e roteamento</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Mini CRM</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Dashboards gerenciais de SLA, conversão e produtividade</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Automações avançadas de follow-up</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Integrações múltiplas com APIs e sistemas externos</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Regras de distribuição de atendimentos</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Suporte prioritário</li>\n        </ul>\n      </article>\n      <article class=\"plan\">\n        <span class=\"plan-tag\">Enterprise</span>\n        <h3>8 agentes + 1 supervisor</h3>\n        <div class=\"price\"><span class=\"v\">R$ 1.649</span><small>/mês</small></div>\n        <p class=\"setup\">Setup: R$ 6.499</p>\n        <ul>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>IA completa com fluxos customizados por operação</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>CRM multi-time ou multi-unidade</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Dashboards executivos personalizados</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Integrações customizadas e projetos sob medida</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Governança de acessos e permissões avançadas</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>Estratégia de otimização contínua</li>\n          <li><span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\"><polyline points=\"20 6 9 17 4 12\"></polyline></svg></span>SLA e acompanhamento dedicado</li>\n        </ul>\n      </article>\n    </div>\n\n    <div class=\"note\" style=\"margin-top:18px;border-left-color:var(--primary)\">\n      <p><b style=\"color:#fff\">Usuários adicionais:</b> Agente por R$ 60/mês e Supervisor por R$ 119/mês, aplicáveis em qualquer plano quando a operação crescer.</p>\n    </div>\n\n    <div class=\"sec-head\" style=\"margin:56px 0 28px\">\n      <div>\n        <div class=\"sec-kicker\">Condição recomendada</div>\n        <h2 class=\"sec-title\" style=\"font-size:clamp(24px,3vw,34px)\">Doces Vovó entra no Pro porque já nasce com 6 usuários e integrações.</h2>\n      </div>\n      <div class=\"disc-hero\" style=\"align-self:center\">\n        <div class=\"big\">PRO</div>\n        <div class=\"txt\"><b>5 + 1</b><span>agentes e supervisor<br>com IA avançada</span></div>\n      </div>\n    </div>\n    <div class=\"table-box\">\n      <div class=\"cap\"><span class=\"dot\"></span>Escopo financeiro recomendado</div>\n      <table>\n        <thead><tr><th>Item</th><th>Escopo</th><th>Valor</th><th>Observação</th></tr></thead>\n        <tbody>\n          <tr><td><b>Plano Pro H-TALKS</b></td><td>5 agentes + 1 supervisor</td><td><span class=\"hl\">R$ 849/mês</span></td><td>plano recomendado para o cenário atual</td></tr>\n          <tr><td><b>Setup Pro</b></td><td>implantação, parametrização, filas, IA e go-live</td><td><span class=\"hl\">R$ 3.999</span></td><td>pagamento único</td></tr>\n          <tr><td><b>Integrações previstas</b></td><td>CRM via API, ERP novo via API/banco e WooCommerce</td><td>incluídas no escopo Pro</td><td>condicionadas à viabilidade técnica e acessos</td></tr>\n          <tr><td><b>SDR IA</b></td><td>5 perguntas de qualificação, objeções e roteamento</td><td>incluído</td><td>configurado com guardrails e ajuste inicial</td></tr>\n          <tr><td><b>Automações de evolução</b></td><td>carrinho abandonado, campanhas e fluxos adicionais</td><td>sob escopo quando necessário</td><td>após a base validada em produção</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n</section>\n\n<!-- ============ CUSTOS EXTERNOS ============ -->\n<section class=\"section section-alt\" data-screen-label=\"Custos externos\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <div>\n        <div class=\"sec-kicker\">Custos externos</div>\n        <h2 class=\"sec-title wide\">IA e WhatsApp oficial são custos de terceiros, pagos sem margem da HEADS.</h2>\n      </div>\n      <p class=\"sec-sub\">Esses valores variam conforme consumo real de mensagens, tokens, templates e campanhas. A HEADS orienta a configuração e acompanha o uso, mas não aplica margem sobre esses
