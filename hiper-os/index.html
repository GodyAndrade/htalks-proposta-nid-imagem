document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

><div style=\"margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#22D3EE\">onda 1 · ativo<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2A2E33;background:#14181D;border-radius:8px;padding:9px 4px;text-align:center\"><div style=\"font-size:12px;font-weight:600;color:#C9D1DA\">Políticas<\u002Fdiv><div style=\"margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9AA4AF\">próx. onda<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2A2E33;background:#14181D;border-radius:8px;padding:9px 4px;text-align:center\"><div style=\"font-size:12px;font-weight:600;color:#C9D1DA\">Operação<\u002Fdiv><div style=\"margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9AA4AF\">próx. onda<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2A2E33;background:#14181D;border-radius:8px;padding:9px 4px;text-align:center\"><div style=\"font-size:12px;font-weight:600;color:#C9D1DA\">Gestão<\u002Fdiv><div style=\"margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9AA4AF\">próx. onda<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #2A2E33;background:#14181D;border-radius:8px;padding:9px 4px;text-align:center\"><div style=\"font-size:12px;font-weight:600;color:#C9D1DA\">Outras áreas<\u002Fdiv><div style=\"margin-top:3px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9AA4AF\">próx. onda<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #2A2E33;background:#080A0D;padding:14px 16px 16px;font-family:'IBM Plex Mono',monospace;font-size:12px\">\n        <div style=\"display:flex;justify-content:space-between;color:#9AA4AF;letter-spacing:.12em\"><span>[04] AUDIT LOG<\u002Fspan><span>identidade · permissões · logs · aprovação<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px;display:grid;gap:6px\">\n          <sc-for list=\"{{ logs }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div style=\"display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;white-space:nowrap;opacity:{{ l.op }}\">\n              <span style=\"color:#5B6470\">{{ l.t }}<\u002Fspan>\n              <span style=\"color:#22D3EE\">{{ l.agent }}<\u002Fspan>\n              <span style=\"color:#C9D1DA;overflow:hidden;text-overflow:ellipsis\">{{ l.msg }}<\u002Fspan>\n              <span style=\"color:#10B981\">{{ l.st }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"02 Resumo\" style=\"padding:0 32px;background:#0B0E12;border-bottom:1px solid #2A2E33\">\n  <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))\">\n    <div style=\"padding:28px 24px 28px 0;border-right:1px solid #2A2E33\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#22D3EE\">01<\u002Fdiv><div style=\"margin-top:8px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;color:#F4F6F8\">Inventário<\u002Fdiv><div style=\"margin-top:4px;font-size:15px;color:#9AA4AF\">quem usa qual LLM e para quê<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:28px 24px;border-right:1px solid #2A2E33\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#22D3EE\">02<\u002Fdiv><div style=\"margin-top:8px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;color:#F4F6F8\">Acesso<\u002Fdiv><div style=\"margin-top:4px;font-size:15px;color:#9AA4AF\">contexto liberado por perfil<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:28px 24px;border-right:1px solid #2A2E33\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#22D3EE\">03<\u002Fdiv><div style=\"margin-top:8px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;color:#F4F6F8\">Segundo cérebro<\u002Fdiv><div style=\"margin-top:4px;font-size:15px;color:#9AA4AF\">fontes oficiais e versionadas<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:28px 24px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#22D3EE\">04<\u002Fdiv><div style=\"margin-top:8px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;color:#F4F6F8\">Rastreabilidade<\u002Fdiv><div style=\"margin-top:4px;font-size:15px;color:#9AA4AF\">evidência proporcional ao risco<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"03 Tese\" style=\"padding:112px 32px;border-bottom:1px solid #2A2E33\">\n  <p style=\"max-width:1100px;margin:0 auto;font-family:Sora,sans-serif;font-weight:600;font-size:clamp(32px,4.4vw,56px);line-height:1.12;letter-spacing:-.03em;color:#F4F6F8;text-wrap:pretty\">A questão não é escolher uma única IA. <span style=\"color:#22D3EE\">É saber quem usa, quais dados entram, o que cada agente pode fazer e como isso é auditado.<\u002Fspan><\u002Fp>\n<\u002Fsection>\n\n<section id=\"arquitetura\" data-screen-label=\"04 Arquitetura\" style=\"padding:112px 32px;background:#F6F7F9;color:#2A2E33\">\n  <div style=\"max-width:1200px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 64px;align-items:end;margin-bottom:56px\">\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#155E9E\">Arquitetura HIPER OS<\u002Fdiv><h2 style=\"margin-top:16px;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(36px,4.8vw,60px);line-height:1.02;letter-spacing:-.035em;color:#111418\">Do uso da IA ao controle.<\u002Fh2><\u002Fdiv>\n      <p style=\"font-size:18px;line-height:1.6;color:#4B5563;max-width:520px;text-wrap:pretty\">Cinco camadas conectam ferramentas, fontes e pessoas. O segundo cérebro fica no centro; identidade e governança atravessam todas as interações.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,196px),1fr));gap:12px\">\n      <article style=\"background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:24px 20px\"><div style=\"width:36px;height:12px;border:2px solid #155E9E;border-radius:50%\"><\u002Fdiv><div style=\"margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#155E9E\">01 · USOS<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:#111418\">LLMs &amp; agentes<\u002Fh3><p style=\"margin-top:10px;font-size:15px;line-height:1.55;color:#4B5563\">Ferramentas, finalidade, fornecedor, dono e dados tratados.<\u002Fp><\u002Farticle>\n      <article style=\"background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:24px 20px\"><div style=\"width:36px;height:12px;border:2px solid #155E9E;border-radius:50%\"><\u002Fdiv><div style=\"margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#155E9E\">02 · FONTES<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:#111418\">Conhecimento homologado<\u002Fh3><p style=\"margin-top:10px;font-size:15px;line-height:1.55;color:#4B5563\">Documentos, processos e regras com origem, versão e acesso.<\u002Fp><\u002Farticle>\n      <article style=\"background:#04335F;border:1px solid #04335F;border-radius:12px;padding:24px 20px;box-shadow:0 18px 40px rgba(4,51,95,.22)\"><div style=\"width:36px;height:12px;border:2px solid #22D3EE;border-radius:50%\"><\u002Fdiv><div style=\"margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#22D3EE\">03 · SEGUNDO CÉREBRO<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:#FFFFFF\">Memória corporativa<\u002Fh3><p style=\"margin-top:10px;font-size:15px;line-height:1.55;color:#D6E6F5\">Contexto consultável conforme o perfil de cada usuário.<\u002Fp><\u002Farticle>\n      <article style=\"background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:24px 20px\"><div style=\"width:36px;height:12px;border:2px solid #155E9E;border-radius:50%\"><\u002Fdiv><div style=\"margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#155E9E\">04 · AGENTES<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:#111418\">Coordenador + pilotos<\u002Fh3><p style=\"margin-top:10px;font-size:15px;line-height:1.55;color:#4B5563\">Consulta, síntese e roteamento com limites explícitos.<\u002Fp><\u002Farticle>\n      <article style=\"background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;padding:24px 20px\"><div style=\"width:36px;height:12px;border:2px solid #155E9E;border-radius:50%\"><\u002Fdiv><div style=\"margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:#155E9E\">05 · CONTROLE<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:20px;font-weight:600;line-height:1.2;color:#111418\">Governança<\u002Fh3><p style=\"margin-top:10px;font-size:15px;line-height:1.55;color:#4B5563\">Acesso, logs, custos, aprovação, revisão e revogação.<\u002Fp><\u002Farticle>\n    <\u002Fdiv>\n    <div style=\"margin-top:12px;height:2px;background:linear-gradient(90deg,#155E9E,#22D3EE)\"><\u002Fdiv>\n    <p style=\"margin-top:24px;font-size:17px;line-height:1.6;color:#4B5563;max-width:820px\"><strong style=\"color:#111418\">Resultado:<\u002Fstrong> os usos de IA abrangidos pelo projeto ficam vinculados a responsável, finalidade, fontes, permissões e evidências verificáveis.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"controle\" data-screen-label=\"05 Plano de controle\" style=\"padding:112px 32px;border-bottom:1px solid #2A2E33\">\n  <div style=\"max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px\">\n    <div>\n      <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#22D3EE\">Plano de controle<\u002Fdiv>\n      <h2 style=\"margin-top:16px;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(36px,4.8vw,60px);line-height:1.02;letter-spacing:-.035em;color:#F4F6F8\">Governar primeiro. Escalar depois.<\u002Fh2>\n      <p style=\"margin-top:24px;font-size:18px;line-height:1.65;color:#C9D1DA;max-width:500px;text-wrap:pretty\">A Hiper Têxtil não precisa concentrar todos os modelos em uma plataforma. Precisa de regras comuns para aprovar usos, classificar dados, restringir contexto e acompanhar cada agente.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;gap:10px\">\n      <div style=\"background:#155E9E;border-radius:12px;padding:22px 24px\"><div style=\"font-family:Sora,sans-serif;font-size:20px;font-weight:600;color:#FFFFFF\">Uma governança comum<\u002Fdiv><div style=\"margin-top:4px;font-size:15px;color:#DCEAF7\">diferentes ferramentas e agentes com contexto, responsável e limites<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px\">\n        <div style=\"border:1px solid #22D3EE;border-radius:12px;padding:18px 20px;background:rgba(34,211,238,.06)\"><div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center\"><span style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Catálogo de IA<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#111418;background:#22D3EE;padding:3px 8px;border-radius:4px\">BASE<\u002Fspan><\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">ferramentas, fornecedores, finalidade e responsáveis<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #2A2E33;border-radius:12px;padding:18px 20px;background:#1A1F25\"><div style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Matriz de acesso<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">papel, área, sigilo e permissão<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #2A2E33;border-radius:12px;padding:18px 20px;background:#1A1F25\"><div style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Fontes oficiais<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">dono, versão, revisão e validade<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #2A2E33;border-radius:12px;padding:18px 20px;background:#1A1F25\"><div style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Trilha de auditoria<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">consultas e ações relevantes, sem coleta irrestrita<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #2A2E33;border-radius:12px;padding:18px 20px;background:#1A1F25\"><div style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Aprovação humana<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">ações sensíveis exigem autorização<\u002Fdiv><\u002Fdiv>\n        <div style=\"border:1px solid #2A2E33;border-radius:12px;padding:18px 20px;background:#1A1F25\"><div style=\"font-family:Sora,sans-serif;font-size:17px;font-weight:600;color:#F4F6F8\">Revogação<\u002Fdiv><div style=\"margin-top:6px;font-size:14px;color:#9AA4AF\">pausa, revisão e desligamento de usos<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:4px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#9AA4AF\">Vale para qualquer LLM ou fornecedor<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" data-screen-label=\"06 Como funciona\" style=\"padding:112px 32px;background:#0B0E12;border-bottom:1px solid #2A2E33\">\n  <div style=\"max-width:1200px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 64px;align-items:end;margin-bottom:56px\">\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#22D3EE\">Como funciona<\u002Fdiv><h2 style=\"margin-top:16px;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(36px,4.8vw,60px);line-height:1.02;letter-spacing:-.035em;color:#F4F6F8\">Da pergunta ao rastro.<\u002Fh2><\u002Fdiv>\n      <p style=\"font-size:18px;line-height:1.6;color:#C9D1DA;max-width:520px;text-wrap:pretty\">Cada uso homologado passa por um fluxo que protege o contexto corporativo sem depender da memória de uma única pessoa.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:28px 20px\">\n      <article style=\"border-top:2px solid #155E9E;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">01<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Identifica<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Usuário, perfil, área e ferramenta.<\u002Fp><\u002Farticle>\n      <article style=\"border-top:2px solid #155E9E;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">02<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Autoriza<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Dados, fontes e ações permitidos.<\u002Fp><\u002Farticle>\n      <article style=\"border-top:2px solid #155E9E;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">03<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Recupera<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Busca na fonte homologada.<\u002Fp><\u002Farticle>\n      <article style=\"border-top:2px solid #155E9E;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">04<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Coordena<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Direciona ao agente do domínio.<\u002Fp><\u002Farticle>\n      <article style=\"border-top:2px solid #155E9E;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">05<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Responde<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Entrega síntese com origem e limite.<\u002Fp><\u002Farticle>\n      <article style=\"border-top:2px solid #22D3EE;padding-top:20px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#22D3EE\">06<\u002Fdiv><h3 style=\"margin-top:10px;font-family:Sora,sans-serif;font-size:21px;font-weight:600;color:#F4F6F8\">Registra<\u002Fh3><p style=\"margin-top:8px;font-size:15px;line-height:1.55;color:#9AA4AF\">Guarda evidência proporcional ao risco.<\u002Fp><\u002Farticle>\n    <\u002Fdiv>\n    <div style=\"margin-top:48px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;background:#1A1F25;border:1px solid #2A2E33;border-radius:12px;padding:22px 24px\">\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#111418;background:#22D3EE;padding:4px 10px;border-radius:4px\">ONDA 1<\u002Fspan>\n      <p style=\"font-size:16px;line-height:1.6;color:#C9D1DA\">O agente da primeira onda é consultivo e somente leitura. Escritas, integrações ativas, publicações e comunicações externas ficam bloqueadas até homologação específica.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"v1\" data-screen-label=\"07 V1\" style=\"padding:112px 32px;border-bottom:1px solid #2A2E33\">\n  <div style=\"max-width:1200px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 64px;align-items:end;margin-bottom:56px\">\n      <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#22D3EE\">Primeira onda de instalação<\u002Fdiv><h2 style=\"margin-top:16px;font-family:Sora,sans-serif;font-weight:700;font-size:clamp(36px,4.8vw,60px);line-height:1.02;letter-spacing:-.035em;color:#F4F6F8\">Estrutura de governança. Um setor com agente próprio.<\u002Fh2><\u002Fdiv>\n      <p style=\"font-size:18px;line-height:1.6;color:#C9D1DA;max-width:520px;text-wrap:pretty\">Além do mapeamento e da estrutura de controle, a primeira onda já instala um agente dedicado a um setor da Hiper Têxtil, escolhido no kickoff, funcionando com fontes, acessos e logs reais.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px\">\n      <article style=\"background:#1A1F25;border:1px solid #2A2E33;border-radius:14px;padding:36px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#6FB1EA\">A · FUNDAÇÃO<\u002Fdiv>\n        <h3 style=\"margin-top:12px;font-family:Sora,sans-serif;font-size:28px;font-weight:600;color:#F4F6F8\">Fundação HIPER OS<\u002Fh3>\n        <div style=\"margin-top:24px;display:grid;gap:14px;font-size:16px;line-height:1.5;color:#C9D1DA\">\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #6FB1EA;border-radius:50%\"><\u002Fspan>Até três áreas no diagnóstico inicial<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #6FB1EA;border-radius:50%\"><\u002Fspan>Até dez usos de LLM/agentes catalogados<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #6FB1EA;border-radius:50%\"><\u002Fspan>Até vinte fontes homologadas<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #6FB1EA;border-radius:50%\"><\u002Fspan>Política operacional e matriz de acesso<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #6FB1EA;border-radius:50%\"><\u002Fspan>Segundo cérebro, logs e rotina de revisão<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Farticle>\n      <article style=\"background:#1A1F25;border:1px solid #2A2E33;border-radius:14px;padding:36px\">\n        <div style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#22D3EE\">B · PRIMEIRA ONDA · 1 SETOR + 1 AGENTE<\u002Fdiv>\n        <h3 style=\"margin-top:12px;font-family:Sora,sans-serif;font-size:28px;font-weight:600;color:#F4F6F8\">Agente do setor piloto<\u002Fh3>\n        <div style=\"margin-top:24px;display:grid;gap:14px;font-size:16px;line-height:1.5;color:#C9D1DA\">\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #22D3EE;border-radius:50%\"><\u002Fspan>Setor definido no kickoff com o patrocinador<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #22D3EE;border-radius:50%\"><\u002Fspan>Agente especialista treinado nas fontes desse setor<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><span style=\"flex:none;width:18px;height:7px;margin-top:8px;border:2px solid #22D3EE;border-radius:50%\"><\u002Fspan>Respostas com fonte, data e acesso por perfil<\u002Fdiv>\n          <div style=\"display:flex;gap:14px\"><sp
