<html lang="pt-BR">

    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    main {
      width: min(720px, 100%);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 32px;

    }
    p {
      margin: 0 0 24px;
      color: #536079;
      font-size: 16px;
      line-height: 1.5;
    }
    ul {
      display: grid;
      gap: 12px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    a {
      display: block;
      padding: 16px 18px;
      border: 1px solid #d8dfeb;
      border-radius: 8px;
      color: #0b5cad;
      background: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover {
      border-color: #0b5cad;
    }

</head>
