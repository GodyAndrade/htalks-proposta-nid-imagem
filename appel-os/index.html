document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

logia<\u002Fdiv>\n          <div style=\"color:#8b918f;font-size:12.5px;\">Proposta executiva · APPEL<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk';font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8b918f;border:1px solid rgba(242,237,227,0.14);border-radius:999px;padding:8px 15px;\">Junho de 2026<\u002Fdiv>\n    <\u002Fheader>\n\n    <section style=\"padding:104px 0 92px;border-bottom:1px solid rgba(242,237,227,0.10);\">\n      <div style=\"color:#67c79a;font-family:'Space Grotesk';font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;\">Primeira camada de inteligência operacional<\u002Fdiv>\n      <h1 style=\"font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(82px,17vw,228px);line-height:0.82;letter-spacing:-0.02em;margin:26px 0 0;\">APPEL<span style=\"color:#67c79a;\">&nbsp;OS<\u002Fspan><\u002Fh1>\n      <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:end;margin-top:46px;\">\n        <p style=\"font-size:clamp(19px,2.1vw,25px);line-height:1.45;color:#d7d4cb;max-width:640px;margin:0;font-family:'Instrument Serif';font-style:italic;\">Um sistema base para organizar conhecimento, processos, rotinas, código e decisões da APPEL em uma estrutura versionada, consultável e pronta para evoluir.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n          <span style=\"font-family:'Space Grotesk';font-size:12.5px;font-weight:500;padding:8px 13px;border:1px solid rgba(103,199,154,0.30);color:#a9e3c6;border-radius:999px;background:rgba(103,199,154,0.07);\">OpenClaw em VPS<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk';font-size:12.5px;font-weight:500;padding:8px 13px;border:1px solid rgba(242,237,227,0.14);color:#cfccc3;border-radius:999px;\">GitHub como fonte de verdade<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk';font-size:12.5px;font-weight:500;padding:8px 13px;border:1px solid rgba(242,237,227,0.14);color:#cfccc3;border-radius:999px;\">Segundo cérebro operacional<\u002Fspan>\n          <span style=\"font-family:'Space Grotesk';font-size:12.5px;font-weight:500;padding:8px 13px;border:1px solid rgba(215,168,77,0.30);color:#e4cd97;border-radius:999px;background:rgba(215,168,77,0.07);\">Canal Telegram ou WhatsApp<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:80px 0;border-bottom:1px solid rgba(242,237,227,0.10);\">\n      <div style=\"display:grid;grid-template-columns:0.92fr 1.08fr;gap:44px;align-items:end;margin-bottom:38px;\">\n        <div>\n          <div style=\"color:#67c79a;font-family:'Space Grotesk';font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;\">O ponto de partida<\u002Fdiv>\n          <h2 style=\"font-family:'Instrument Serif';font-weight:400;font-size:clamp(34px,4.2vw,52px);line-height:1.02;letter-spacing:-0.01em;margin:14px 0 0;\">A APPEL já começou. Agora é hora de organizar como infraestrutura.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"color:#9aa0a0;font-size:16px;line-height:1.6;margin:0;\">A base inicial já existe: markdowns, skills, pesquisas, rotinas de e-commerce e um mini SaaS acompanhando vendas, estoque e integrações. O próximo passo é profissionalizar a estrutura para ela crescer com controle.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;border:1px solid rgba(242,237,227,0.12);border-radius:6px;overflow:hidden;\">\n        <div style=\"padding:30px 32px;background:rgba(242,237,227,0.015);\">\n          <span style=\"font-family:'Space Grotesk';font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#e4cd97;\">Hoje<\u002Fspan>\n          <h3 style=\"font-family:'Instrument Serif';font-weight:400;font-size:25px;margin:10px 0 18px;\">Base em formação<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;\">\n            <li style=\"color:#bdbab1;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#7a807e;\"><\u002Fspan>Arquivos e automações espalhados<\u002Fli>\n            <li style=\"color:#bdbab1;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#7a807e;\"><\u002Fspan>Conhecimento sem fonte única<\u002Fli>\n            <li style=\"color:#bdbab1;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#7a807e;\"><\u002Fspan>Mini SaaS pouco documentado<\u002Fli>\n            <li style=\"color:#bdbab1;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#7a807e;\"><\u002Fspan>Evolução dependente de contexto manual<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"display:grid;place-items:center;padding:0 26px;border-left:1px solid rgba(242,237,227,0.12);border-right:1px solid rgba(242,237,227,0.12);color:#67c79a;font-family:'Instrument Serif';font-size:40px;background:rgba(103,199,154,0.04);\">→<\u002Fdiv>\n        <div style=\"padding:30px 32px;background:rgba(103,199,154,0.05);\">\n          <span style=\"font-family:'Space Grotesk';font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#a9e3c6;\">Com APPEL OS<\u002Fspan>\n          <h3 style=\"font-family:'Instrument Serif';font-weight:400;font-size:25px;margin:10px 0 18px;\">Camada operacional<\u002Fh3>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;\">\n            <li style=\"color:#dad7ce;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#67c79a;\"><\u002Fspan>GitHub como fonte de verdade<\u002Fli>\n            <li style=\"color:#dad7ce;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#67c79a;\"><\u002Fspan>Segundo cérebro estruturado<\u002Fli>\n            <li style=\"color:#dad7ce;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#67c79a;\"><\u002Fspan>OpenClaw rodando em ambiente próprio<\u002Fli>\n            <li style=\"color:#dad7ce;padding-left:20px;position:relative;font-size:14.5px;\"><span style=\"position:absolute;left:0;top:0.55em;width:5px;height:5px;border-radius:50%;background:#67c79a;\"><\u002Fspan>Canal simples para consulta e registro<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:80px 0;border-bottom:1px solid rgba(242,237,227,0.10);\">\n      <div style=\"display:grid;grid-template-columns:0.92fr 1.08fr;gap:44px;align-items:end;margin-bottom:38px;\">\n        <div>\n          <div style=\"color:#67c79a;font-family:'Space Grotesk';font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;\">O que muda na prática<\u002Fdiv>\n          <h2 style=\"font-family:'Instrument Serif';font-weight:400;font-size:clamp(34px,4.2vw,52px);line-height:1.02;letter-spacing:-0.01em;margin:14px 0 0;\">Menos memória solta. Mais operação consultável.<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"color:#9aa0a0;font-size:16px;line-height:1.6;margin:0;\">A entrega cria um lugar confiável para guardar decisões, processos, pendências, projetos, integrações e contexto técnico. Isso reduz perda de contexto e prepara a base para novas automações.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"di
